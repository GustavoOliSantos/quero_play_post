name: 1. Gerar carrossel

on:
  schedule:
    # Horário em UTC (Brasília + 3h). "0 12 * * *" = gera às 9h de Brasília.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      postar_depois:
        description: "Depois de gerar, pedir aprovação para postar"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    outputs:
      post_id: ${{ steps.gerar.outputs.post_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar carrossel (IA + imagens)
        id: gerar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          IA_PROVEDOR: ${{ vars.IA_PROVEDOR }}
          NICHO: ${{ vars.NICHO }}
          PERFIL: ${{ vars.PERFIL }}
          SLIDES: ${{ vars.SLIDES }}
          USAR_IMAGEM_IA: ${{ vars.USAR_IMAGEM_IA }}
        run: python main.py gerar

      - name: Colocar na fila (salvar no repositório)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fila historico.json
          git commit -m "fila: ${{ steps.gerar.outputs.post_id }}"
          git pull --rebase
          git push

      - name: Mostrar prévia nesta página
        env:
          PERFIL: ${{ vars.PERFIL }}
        run: python main.py resumo "${{ steps.gerar.outputs.post_id }}"

  postar:
    needs: gerar
    if: ${{ github.event_name == 'schedule' || inputs.postar_depois }}
    uses: ./.github/workflows/postar.yml
    with:
      post_id: ${{ needs.gerar.outputs.post_id }}
    secrets: inherit
